<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Какого цвета ёлки?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .quiz-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .option {
            margin: 10px 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .option:hover { background-color: #eef2ff; }
        .option input { margin-right: 10px; cursor: pointer; }
        .option label { cursor: pointer; display: block; width: 100%; }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 15px;
        }
        button:hover { background-color: #45a049; }
        #status {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2>Вопрос: Какого цвета ёлки?</h2>
    <form id="quizForm">
        <div class="option">
            <label><input type="radio" name="answer" value="Красного" required> Красного</label>
        </div>
        <div class="option">
            <label><input type="radio" name="answer" value="Зеленого"> Зеленого</label>
        </div>
        <div class="option">
            <label><input type="radio" name="answer" value="Синего"> Синего</label>
        </div>
        
        <button type="submit">Узнать результат</button>
    </form>
    <div id="status"></div>
</div>

<script>
    document.getElementById('quizForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Запрещаем перезагрузку страницы
        
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = "Отправка результатов...";
        statusDiv.style.color = "#333";

        const formData = new FormData(this);

        // Отправляем выбранный ответ в файл send.php
        fetch('send.php', {
            method: 'POST',
            body: formData
        })
        .then(response => response.text())
        .then(data => {
            if (data.trim() === 'success') {
                statusDiv.innerHTML = "Спасибо! Результат успешно отправлен на почту.";
                statusDiv.style.color = "green";
                document.getElementById('quizForm').reset(); // Очищаем форму
            } else {
                statusDiv.innerHTML = "Ошибка сервера при отправке.";
                statusDiv.style.color = "red";
            }
        })
        .catch(error => {
            statusDiv.innerHTML = "Ошибка сети. Не удалось связаться с сервером.";
            statusDiv.style.color = "red";
        });
    });
</script>

</body>
</html>
